syntax = "proto3";

package mcp_service;

import "google/protobuf/empty.proto";
import "proto/common/common.proto";
import "proto/mcp-service/common.proto";
import "proto/mcp-service/skill-service.proto";

option go_package = "github.com/UnicomAI/wanwu/api/proto/mcp-service";

service MCPService {
  // --- square mcp ---
  rpc GetSquareMCP(GetSquareMCPReq) returns (SquareMCPDetail) {}
  rpc GetSquareMCPList(GetSquareMCPListReq) returns (SquareMCPList) {}

  // --- custom mcp ---
  rpc CreateCustomMCP(CreateCustomMCPReq) returns (google.protobuf.Empty) {}
  rpc UpdateCustomMCP(UpdateCustomMCPReq) returns (google.protobuf.Empty) {}
  rpc GetCustomMCP(GetCustomMCPReq) returns (CustomMCPDetail) {}
  rpc DeleteCustomMCP(DeleteCustomMCPReq) returns (google.protobuf.Empty) {}
  rpc GetCustomMCPList(GetCustomMCPListReq) returns (CustomMCPList) {}

  // --- custom mcp action ---
  rpc GetMCPToolList(GetMCPToolListReq) returns (MCPToolList) {}
  rpc GetMCPAvatar(GetMCPAvatarReq) returns (MCPAvatar) {}

  // --- custom tool ---
  rpc CreateCustomTool(CreateCustomToolReq) returns (google.protobuf.Empty) {}
  rpc GetCustomToolInfo(GetCustomToolInfoReq) returns (GetCustomToolInfoResp) {}
  rpc GetCustomToolList(GetCustomToolListReq) returns (GetCustomToolListResp) {}
  rpc GetCustomToolByCustomToolIdList(GetCustomToolByCustomToolIdListReq) returns (GetCustomToolListResp) {}
  rpc UpdateCustomTool(UpdateCustomToolReq) returns (google.protobuf.Empty) {}
  rpc DeleteCustomTool(DeleteCustomToolReq) returns (google.protobuf.Empty) {}

  // --- builtin tool ---
  rpc GetSquareTool(GetSquareToolReq) returns (SquareToolDetail) {}
  rpc GetSquareToolList(GetSquareToolListReq) returns (SquareToolList) {}
  rpc UpsertBuiltinToolAPIKey(UpsertBuiltinToolAPIKeyReq) returns (google.protobuf.Empty) {}

  // --- mcp server ---
  rpc CreateMCPServer(CreateMCPServerReq) returns (CreateMCPServerResp) {}
  rpc DeleteMCPServer(DeleteMCPServerReq) returns (google.protobuf.Empty) {}
  rpc UpdateMCPServer(UpdateMCPServerReq) returns (google.protobuf.Empty) {}
  rpc GetMCPServer(GetMCPServerReq) returns (MCPServerInfo) {}
  rpc GetMCPServerList(GetMCPServerListReq) returns (GetMCPServerListResp) {}
  rpc CreateMCPServerTool(CreateMCPServerToolReq) returns (google.protobuf.Empty) {}
  rpc UpdateMCPServerTool(UpdateMCPServerToolReq) returns (google.protobuf.Empty) {}
  rpc DeleteMCPServerTool(DeleteMCPServerToolReq) returns (google.protobuf.Empty) {}
  rpc GetMCPServerTool(GetMCPServerToolReq) returns (MCPServerToolInfo) {}
  rpc GetMCPServerToolList(GetMCPServerToolListReq) returns (GetMCPServerToolListResp) {}

  // --- custom builtin tool ---
  rpc GetToolSelect(GetToolSelectReq) returns (GetToolListResp) {}
  rpc GetToolByIdList(GetToolByToolIdListReq) returns (GetToolByToolIdListResp) {}
  rpc GetToolDetailByIdList(GetToolByToolIdListReq) returns (GetToolDetailByToolIdListResp) {}

  // --- mcp mcpserver tool ---
  rpc GetMCPByMCPIdList(GetMCPByMCPIdListReq) returns (GetMCPByMCPIdListResp) {}

  // --- custom skill ---
  rpc CustomSkillCreate(CustomSkillCreateReq) returns (CustomSkillCreateResp) {}
  rpc CustomSkillDelete(CustomSkillDeleteReq) returns (google.protobuf.Empty) {}
  rpc CustomSkillGet(CustomSkillGetReq) returns (PublishCustomSkill) {}
  rpc GetCustomSkillByPreviewID(GetCustomSkillByPreviewIDReq) returns (GetCustomSkillByPreviewIDResp) {}
  rpc GetCustomSkillByThreadID(GetCustomSkillByThreadIDReq) returns (GetCustomSkillByThreadIDResp) {}
  rpc GetCustomSkillListByThreadIDList(GetCustomSkillListByThreadIDListReq) returns (CustomSkillGetListResp) {}
  rpc CustomSkillGetList(CustomSkillGetListReq) returns (CustomSkillGetListResp) {}
  // 管理员中心 skill 全局分页列表（跨用户，按 userId[]/orgId[] 过滤）
  rpc AdminCustomSkillPageList(AdminCustomSkillPageListReq) returns (CustomSkillGetListResp) {}
  rpc GetCustomSkillDetailByIdList(CustomSkillDetailByIdListReq) returns (CustomSkillDetailByIdListResp) {}
  rpc UpdateCustomSkillBasicMeta(UpdateCustomSkillBasicMetaReq) returns (google.protobuf.Empty) {}
  rpc UpdateCustomSkillThreadMeta(UpdateCustomSkillThreadMetaReq) returns (google.protobuf.Empty) {}
  rpc CreateCustomSkillVar(CreateCustomSkillVarReq) returns (SkillVariableCreateResp) {}
  rpc GetCustomSkillVars(GetCustomSkillVarsReq) returns (CustomSkillVars) {}
  rpc UpdateCustomSkillVar(UpdateCustomSkillVarReq) returns (google.protobuf.Empty) {}
  rpc DeleteCustomSkillVar(DeleteCustomSkillVarReq) returns (google.protobuf.Empty) {}

  // --- acquired skill ---
  rpc AcquiredSkillCreate(AcquiredSkillCreateReq) returns (AcquiredSkillCreateResp) {}
  rpc AcquiredSkillDelete(AcquiredSkillDeleteReq) returns (google.protobuf.Empty) {}
  rpc AcquiredSkillGet(AcquiredSkillGetReq) returns (AcquiredSkill) {}
  rpc AcquiredSkillGetList(AcquiredSkillGetListReq) returns (AcquiredSkillGetListResp) {}
  rpc AcquiredSkillGetByIDList(AcquiredSkillGetByIDListReq) returns (AcquiredSkillGetByIDListResp) {}
  rpc AcquiredSkillGetHistoryList(AcquiredSkillGetHistoryListReq) returns (AcquiredSkillHistoryListResp) {}
  rpc CreateAcquiredSkillVar(CreateAcquiredSkillVarReq) returns (SkillVariableCreateResp) {}
  rpc GetAcquiredSkillVars(GetAcquiredSkillVarsReq) returns (AcquiredSkillVars) {}
  rpc UpdateAcquiredSkillVar(UpdateAcquiredSkillVarReq) returns (google.protobuf.Empty) {}
  rpc DeleteAcquiredSkillVar(DeleteAcquiredSkillVarReq) returns (google.protobuf.Empty) {}
  rpc CheckAcquiredSkill(CheckAcquiredSkillReq) returns (CheckAcquiredSkillResp) {}

  // --- builtin skill config ---
  rpc CreateBuiltinSkillVar(CreateBuiltinSkillVarReq) returns (SkillVariableCreateResp) {}
  rpc DeleteBuiltinSkillVar(DeleteBuiltinSkillVarReq) returns (google.protobuf.Empty) {}
  rpc GetBuiltinSkillVars(GetBuiltinSkillVarsReq) returns (BuiltinSkillVars) {}
  rpc UpdateBuiltinSkillVar(UpdateBuiltinSkillVarReq) returns (google.protobuf.Empty) {}
  rpc GetBuiltinSkillsVars(GetBuiltinSkillsVarsReq) returns (GetBuiltinSkillsVarsResp) {}

  // --- skill publish ---
  rpc CreatePublishCustomSkill(PublishCustomSkillReq) returns (google.protobuf.Empty) {}
  rpc UpdatePublishCustomSkill(UpdatePublishCustomSkillReq) returns (google.protobuf.Empty) {}
  rpc GetPublishCustomSkillHistoryList(GetPublishCustomSkillHistoryListReq) returns (PublishCustomSkillHistoryListResp) {}
  rpc GetPublishCustomSkillByLatest(GetPublishCustomSkillByLatestReq) returns (PublishCustomSkill) {}
  rpc GetPublishCustomSkillByVersion(GetPublishCustomSkillByVersionReq) returns (PublishCustomSkill) {}
  rpc GetPublishCustomSkillList(GetPublishCustomSkillListReq) returns (GetPublishCustomSkillListResp) {}
  rpc GetPublishCustomSkillByIDList(GetPublishCustomSkillByIDListReq) returns (GetPublishCustomSkillByIDListResp) {}

  // --- skill statistic ---
  rpc IncrementCustomSkillDownloadCount(IncrementCustomSkillDownloadCountReq) returns (google.protobuf.Empty) {}
  rpc IncrementCustomSkillAcquiredCount(IncrementCustomSkillAcquiredCountReq) returns (google.protobuf.Empty) {}
  rpc IncrementBuiltinSkillDownloadCount(IncrementBuiltinSkillDownloadCountReq) returns (google.protobuf.Empty) {}
  rpc GetBuiltinSkillDownloadCounts(GetBuiltinSkillDownloadCountsReq) returns (GetBuiltinSkillDownloadCountsResp) {}

  // --- admin center ---
  rpc GetAdminCustomToolPageList(GetAdminCustomToolPageListReq) returns (GetAdminCustomToolPageListResp) {}
  rpc GetAdminCustomMCPPageList(GetAdminCustomMCPPageListReq) returns (GetAdminCustomMCPPageListResp) {}
  rpc GetAdminMCPServerPageList(GetAdminMCPServerPageListReq) returns (GetAdminMCPServerPageListResp) {}
}

// --- req ---

message GetSquareMCPReq {
  string orgId = 1;
  string userId = 2;
  string mcpSquareId = 3;
}

message GetSquareMCPListReq {
  string orgId = 1;    // (暂无)
  string userId = 2;   // (暂无)
  string category = 3; // all | data | create | search | ...
  string name = 4;
}

message SquareMCPList {
  repeated SquareMCPInfo infos = 1;
}

message CreateCustomMCPReq {
  string orgId = 1;
  string userId = 2;
  string mcpSquareId = 3;
  string name = 4;
  string desc = 5;
  string from = 6;
  string sseUrl = 7;
  string avatarPath = 8;
  string streamableUrl = 9;
  string transport = 10; // 传输协议: "sse" 或 "streamable"
  common.ApiAuthWebRequest apiAuth = 11; // api身份认证
  map<string, string> headers = 12; // 请求头
}

message UpdateCustomMCPReq {
  string orgId = 1;
  string userId = 2;
  string mcpId = 3;
  string name = 4;
  string desc = 5;
  string from = 6;
  string sseUrl = 7;
  string avatarPath = 8;
  string streamableUrl = 9;
  string transport = 10; // 传输协议: "sse" 或 "streamable"
  common.ApiAuthWebRequest apiAuth = 11; // api身份认证
  map<string, string> headers = 12; // 请求头
}

message GetCustomMCPReq {
  string mcpId = 1;
}


message DeleteCustomMCPReq {
  string mcpId = 1;
}

message GetCustomMCPListReq {
  string orgId = 1;
  string userId = 2;
  string name = 3;
}

message CustomMCPList {
  repeated CustomMCPInfo infos = 1;
}

message GetMCPToolListReq {
  string mcpId = 1;  // mcpId优先
  string sseUrl = 2; // mcpId为空取sseUrl
}

message MCPToolList {
  repeated common.ToolAction tools = 1;
}

message GetMCPAvatarReq {
  string avatarPath = 1;
}

message MCPAvatar {
  string fileName = 1; // 文件名
  bytes data = 2;      // 文件二进制数据
}

// --- mcp ---

message CustomMCPDetail {
  string mcpId = 1;
  string sseUrl = 2;
  string avatarPath = 3;
  SquareMCPInfo info = 4;
  SquareMCPIntro intro = 5;
  string streamableUrl = 6;
  string transport = 7; // 传输协议: "sse" 或 "streamable"
  common.ApiAuthWebRequest apiAuth = 8; // api身份认证
  map<string, string> headers = 9; // 请求头
  Identity owner = 10; // 资源所有者（管理员中心owner解析用）
  int64 createdAt = 11; // 创建时间（毫秒）
  int64 updatedAt = 12; // 更新时间（毫秒）
}

message CustomMCPInfo {
  string mcpId = 1;
  string sseUrl = 2;
  string avatarPath = 3;
  SquareMCPInfo info = 4;
  string streamableUrl = 5;
  string transport = 6; // 传输协议: "sse" 或 "streamable"
  common.ApiAuthWebRequest apiAuth = 7; // api身份认证
  map<string, string> headers = 8; // 请求头
  Identity owner = 9; // 资源所有者（管理员中心owner解析用）
  int64 updatedAt = 10; // 更新时间（毫秒）
}

message SquareMCPDetail {
  SquareMCPInfo info = 1;
  SquareMCPIntro intro = 2;
  MCPTools tool = 3;
}

message SquareMCPInfo {
  string mcpSquareId = 1;
  string avatarPath = 2;
  string name = 3;
  string desc = 4;
  string from = 5;
  string category = 6;
}

message SquareMCPIntro {
  string summary = 1;  // 使用概述
  string feature = 2;  // 特性说明
  string scenario = 3; // 应用场景
  string manual = 4;   // 使用说明
  string detail = 5;   // 详情
}

message MCPTools {
  string sseUrl = 1;
  bool hasCustom = 2;
  repeated common.ToolAction tools = 3;
}

message GetMCPByMCPIdListReq {
  repeated string mcpIdList = 1;
  repeated string mcpServerIdList = 2;
  Identity identity = 3;
}

message GetMCPByMCPIdListResp {
  repeated CustomMCPInfo infos = 1;
  repeated MCPServerInfo servers = 2;
}


// --- customTool ---

message CreateCustomToolReq {
  Identity identity = 1;
  string schema = 2;
  common.ApiAuthWebRequest apiAuth = 3;
  string name = 4;
  string description = 5;
  string privacyPolicy = 6;
  string avatarPath = 7;
}

message GetCustomToolInfoReq {
  string customToolId = 1;
  Identity identity = 2;
}

message GetCustomToolInfoResp {
  string customToolId = 1;
  string schema = 2;
  common.ApiAuthWebRequest apiAuth = 3;
  string name = 4;
  string description = 5;
  string privacyPolicy = 6;
  string avatarPath = 7;
  Identity owner = 8; // 资源所有者（管理员中心owner解析用）
  int64 createdAt = 9; // 创建时间（毫秒）
  int64 updatedAt = 10; // 更新时间（毫秒）
}

message GetCustomToolListReq {
  Identity identity = 1;
  string name = 2;
}

message GetCustomToolByCustomToolIdListReq {
  Identity identity = 1;
  repeated string customToolIdList = 2;
}

message GetCustomToolItem {
  string customToolId = 1;
  string name = 2;
  string description = 3;
  string avatarPath = 4;
}

message GetCustomToolListResp {
  repeated GetCustomToolItem list = 1;
}

// --- admin center ---

message GetAdminCustomToolPageListReq {
  string name = 1;                     // 名称（模糊查询）
  repeated string orgIdList = 2;       // 组织id列表（空=全部组织）
  repeated string userIdList = 3;      // 用户id列表（空=全部用户）
  int32 pageNo = 4;                    // 页码（从1开始）
  int32 pageSize = 5;                  // 每页条数
}

message AdminCustomToolItem {
  string customToolId = 1;
  string name = 2;
  string description = 3;
  string avatarPath = 4;
  Identity owner = 5;                  // 资源所有者
  int64 updatedAt = 6;                 // 更新时间（毫秒）
}

message GetAdminCustomToolPageListResp {
  repeated AdminCustomToolItem list = 1;
  int64 total = 2;                     // 总条数
}

// --- admin center: mcp ---

message GetAdminCustomMCPPageListReq {
  string name = 1;                     // 名称（模糊查询）
  repeated string orgIdList = 2;       // 组织id列表（空=全部组织）
  repeated string userIdList = 3;      // 用户id列表（空=全部用户）
  int32 pageNo = 4;                    // 页码（从1开始）
  int32 pageSize = 5;                  // 每页条数
}

message AdminCustomMCPItem {
  string mcpId = 1;
  string name = 2;
  string desc = 3;
  string avatarPath = 4;
  string from = 5;                     // 来源
  Identity owner = 6;                  // 资源所有者
  int64 updatedAt = 7;                 // 更新时间（毫秒）
}

message GetAdminCustomMCPPageListResp {
  repeated AdminCustomMCPItem list = 1;
  int64 total = 2;                     // 总条数
}

// --- admin center: mcp server ---

message GetAdminMCPServerPageListReq {
  string name = 1;                     // 名称（模糊查询）
  repeated string orgIdList = 2;       // 组织id列表（空=全部组织）
  repeated string userIdList = 3;      // 用户id列表（空=全部用户）
  int32 pageNo = 4;                    // 页码（从1开始）
  int32 pageSize = 5;                  // 每页条数
}

message AdminMCPServerItem {
  string mcpServerId = 1;
  string name = 2;
  string desc = 3;
  string avatarPath = 4;
  Identity owner = 5;                  // 资源所有者
  int64 updatedAt = 6;                 // 更新时间（毫秒）
}

message GetAdminMCPServerPageListResp {
  repeated AdminMCPServerItem list = 1;
  int64 total = 2;                     // 总条数
}

message UpdateCustomToolReq {
  string customToolId = 1;
  string schema = 2;
  common.ApiAuthWebRequest apiAuth = 3;
  string name = 4;
  string description = 5;
  string privacyPolicy = 6;
  Identity identity = 7;
  string avatarPath = 8;
}

message DeleteCustomToolReq {
  string customToolId = 1;
}

message GetSquareToolReq {
  string toolSquareId = 1;
  Identity identity = 2;
}

message SquareToolDetail {
  ToolSquareInfo info = 1;
  BuiltInTools builtInTools = 2;
  string schema = 3;
}

message ToolSquareInfo {
  string toolSquareId = 1;
  string avatarPath = 2;
  string name = 3;
  string desc = 4;
  string tags = 5;
}

message BuiltInTools {
  repeated common.ToolAction tools = 1;
  common.ApiAuthWebRequest apiAuth = 2;
  string detail = 3;
  int32 actionSum = 4;
  bool needApiKeyInput = 5;
}

message GetSquareToolListReq {
  string name = 1;
}

message SquareToolList {
  repeated ToolSquareInfo infos = 1;
}

message UpsertBuiltinToolAPIKeyReq {
  string toolSquareId = 1;
  string apiKey = 2;
  Identity identity = 3;
}

message GetToolSelectReq {
  string name = 1;
  Identity identity = 2;
}

message GetToolItem {
  string toolId = 1;
  string toolName = 2;
  string toolType = 3;
  string desc = 4;
  string apiKey = 5;
  bool needApiKeyInput = 6;
  string avatarPath = 7;
}

message GetToolListResp {
  repeated GetToolItem list = 1;
  int32 total = 2;
}

// mcp server

message MCPServerInfo{
  string mcpServerId = 1;
  string name = 2;
  string desc = 3;
  int64  toolNum = 4;
  string avatarPath = 5;
  string sseUrl = 6;
  string sseExample = 7;
  string streamableUrl = 8;
  string streamableExample = 9;
  string transport = 10; // 传输协议: "sse" 或 "streamable"
  Identity owner = 11; // 资源所有者（管理员中心owner解析用）
  int64 createdAt = 12; // 创建时间（毫秒）
  int64 updatedAt = 13; // 更新时间（毫秒）
}

message CreateMCPServerReq {
  string name = 1;
  string desc = 2;
  string avatarPath = 3;
  Identity identity = 4;
}

message CreateMCPServerResp {
  string mcpServerId = 1;
}

message UpdateMCPServerReq {
  string mcpServerId = 1;
  string name = 2;
  string desc = 3;
  string avatarPath = 4;
}

message GetMCPServerReq {
  string mcpServerId = 1;
}

message DeleteMCPServerReq {
  string mcpServerId = 1;
}

message GetMCPServerListReq {
  string name = 1;
  Identity identity = 2;
}

message GetMCPServerListResp {
  repeated MCPServerInfo list = 1;
}

message CreateMCPServerToolReq {
  string mcpServerId = 1;
  repeated MCPServerToolInfo mcpServiceToolInfos = 2;
}

message UpdateMCPServerToolReq {
  string mcpServerToolId = 1;
  string name = 2;
  string desc = 3;
  string schema = 4;
}

message DeleteMCPServerToolReq {
  string mcpServerToolId = 1;
}

message GetMCPServerToolReq {
  string mcpServerToolId = 1;
}

message GetMCPServerToolListReq {
  string mcpServerId = 1;
}

message GetMCPServerToolListResp {
  repeated MCPServerToolInfo list = 1;
}

message MCPServerToolInfo {
  string mcpServerToolId = 1;
  string mcpServerId = 2;
  string name = 3;
  string desc = 4;
  string Type = 5;
  string appToolId = 6;
  string appToolName = 7;
  string schema = 8;
  common.ApiAuth apiAuth = 9;
}
message GetToolByToolIdListReq {
  repeated string builtInToolIdList = 1;
  repeated string customToolIdList = 2;
  Identity identity = 3;
}

message GetToolByToolIdListResp {
  repeated GetCustomToolItem list = 1;
  repeated ToolSquareInfo toolSquareInfoList = 2;
}

message GetToolDetailByToolIdListResp {
  repeated GetCustomToolInfoResp customList = 1;
  repeated SquareToolDetail toolSquareInfoList = 2;
}

// --- skill statistic ---

message IncrementCustomSkillDownloadCountReq {
  string skill_id = 1;
}

message IncrementCustomSkillAcquiredCountReq {
  string skill_id = 1;
}

message IncrementBuiltinSkillDownloadCountReq {
  string skillId = 1;
}

message GetBuiltinSkillDownloadCountsReq {
  repeated string skillIds = 1;
}

message GetBuiltinSkillDownloadCountsResp {
  map<string, int32> countMap = 1;  // skill_id -> download_count
}

