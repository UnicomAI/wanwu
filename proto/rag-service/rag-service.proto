syntax = "proto3";

package rag_service;

import "google/protobuf/empty.proto";
import "proto/common/common.proto";

option go_package = "github.com/UnicomAI/wanwu/api/proto/rag-service";

service RagService {
  // 流式对话 [EN] streaming conversation
  rpc ChatRag(ChatRagReq) returns (stream ChatRagResp) {}
  // 创建 rag [EN] Create a rag
  rpc CreateRag(CreateRagReq) returns (CreateRagResp) {}
  // 更新 rag 基本信息 [EN] Update rag basic information
  rpc UpdateRag(UpdateRagReq) returns (google.protobuf.Empty) {}
  // 更新 rag 配置信息 [EN] Update rag configuration information
  rpc UpdateRagConfig(UpdateRagConfigReq) returns (google.protobuf.Empty) {}
  // 删除 rag [EN] Delete rag
  rpc DeleteRag(RagDeleteReq) returns (google.protobuf.Empty) {}
  // 获取 rag [EN] Get rag
  rpc GetRagDetail(RagDetailReq) returns (RagInfo) {}
  // 获取 rag 列表 [EN] Get rag list
  rpc ListRag(RagListReq) returns (RagListResp) {}
  // 根据 ragIds 获取 rag 列表 [EN] Get the rag list based on ragIds
  rpc GetRagByIds(GetRagByIdsReq) returns (AppBriefList) {}
  // 复制 rag [EN] Copy rag
  rpc CopyRag(CopyRagReq) returns (CreateRagResp) {}
}
message Identity {
  string userId = 1;
  string orgId = 2;
}

message ChatRagReq {
  string ragId = 1;
  string question = 2;
  Identity identity = 3;
  repeated HistoryItem history = 4;
}

message HistoryItem {
  string  query = 1;
  string  response = 2;
  bool  needHistory = 3;
}

message ChatRagResp {
  string content = 1;
}

message UpdateRagReq{
  string ragId = 1;
  common.AppBriefConfig appBrief = 2;
  Identity identity = 3;
}

message UpdateRagConfigReq{
  string ragId = 1;
  common.AppModelConfig modelConfig = 2;                  // 模型 [EN] Model
  common.AppModelConfig rerankConfig = 3;                 // Rerank模型 [EN] Rerank model
  RagKnowledgeBaseConfig knowledgeBaseConfig = 4;         // 知识库 [EN] knowledge base
  RagSensitiveConfig sensitiveConfig = 5;                 // 安全护栏 [EN] safety guardrail
}

message CreateRagReq {
  common.AppBriefConfig appBrief = 1;
  Identity identity = 2;
}

message CreateRagResp {
  string ragId = 1;
}

message RagInfo {
  string ragId = 1;
  common.AppBriefConfig briefConfig = 2;
  common.AppModelConfig modelConfig = 3;                  // 模型 [EN] Model
  common.AppModelConfig rerankConfig = 4;                 // Rerank模型 [EN] Rerank model
  RagKnowledgeBaseConfig knowledgeBaseConfig = 5;         // 知识库 [EN] knowledge base
  RagSensitiveConfig sensitiveConfig = 6; // 安全护栏 [EN] safety guardrail
  Identity identity = 7;
}

message RagDeleteReq {
  string ragId = 1;
}

message RagDetailReq {
  string ragId = 1;
}

message RagKnowledgeBaseConfig {
  repeated RagPerKnowledgeConfig perKnowledgeConfigs = 1;
  RagGlobalConfig globalConfig = 2;
}

message RagPerKnowledgeConfig{
  string knowledgeId = 1;
  int32 graphSwitch = 2;
  RagMetaFilter ragMetaFilter = 3;
}

message RagMetaFilter{
  bool filterEnable = 1;
  string filterLogicType = 2;
  repeated RagMetaFilterItem filterItems = 3;
}

message RagMetaFilterItem{
  string key = 1;
  string type = 2;
  string value = 3;
  string condition = 4;
}

message RagGlobalConfig{
  int32 maxHistory = 1;                           // 最长上下文 [EN] longest context
  float threshold = 2;                            // 过滤阈值 [EN] filter threshold
  int32 topK = 3;                                 // topK
  string matchType = 4; //matchType：vector（向量检索）、text（文本检索）、mix（混合检索：向量+文本） [EN] matchType: vector (vector search), text (text search), mix (mixed search: vector + text)
  float keywordPriority = 5;// 关键词权重 [EN] Keyword weight
  int32 priorityMatch = 6;// 权重匹配，只有在混合检索模式下，选择权重设置后，这个才设置为1 [EN] Weight matching. This is only set to 1 after selecting the weight setting in mixed search mode.
  float semanticsPriority = 7;// 语义权重 [EN] semantic weight
  float termWeight = 8; // 关键词系数，默认为1 [EN] Keyword coefficient, default is 1
  bool termWeightEnable = 9; // 关键词系数开关 [EN] Keyword coefficient switch
  bool useGraph = 10; // 知识图谱开关 [EN] Knowledge graph switch
}

message RagSensitiveConfig{
  bool enable = 1; // 是否启用安全护栏 [EN] Whether to enable safety guardrails
  repeated string tableIds = 2; // 敏感词表id [EN] Sensitive word list id
}

message RagListReq {
  string name = 1;
  Identity identity = 2;
}

message RagListResp {
  repeated common.AppBrief ragInfos = 1;
  int64 total = 2;
}

message GetRagByIdsReq{
  repeated string ragIdList = 1;
}

message AppBriefList{
  repeated common.AppBrief ragInfos = 1;
}

message CopyRagReq{
  string ragId = 1;
  Identity identity = 2;
}