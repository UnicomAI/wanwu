syntax = "proto3";

package app_service;

import "google/protobuf/empty.proto";
import "proto/common/common.proto";

option go_package = "github.com/UnicomAI/wanwu/api/proto/app-service";

service AppService {
  // --- apiKey ---
  rpc CreateApiKey(CreateApiKeyReq) returns (ApiKeyInfo) {}
  rpc DeleteApiKey(DeleteApiKeyReq) returns (google.protobuf.Empty) {}
  rpc ListApiKeys(ListApiKeysReq) returns (ApiKeyInfoList) {}
  rpc UpdateApiKey(UpdateApiKeyReq) returns (google.protobuf.Empty) {}
  rpc UpdateApiKeyStatus(UpdateApiKeyStatusReq) returns (google.protobuf.Empty) {}
  rpc GetApiKeyByKey(GetApiKeyByKeyReq) returns (ApiKeyInfo) {}
  // --- appKey ---
  rpc GenAppKey(GenAppKeyReq) returns (AppKeyInfo) {}
  rpc GetAppKeyList(GetAppKeyListReq) returns (AppKeyInfoList) {}
  rpc DelAppKey(DelAppKeyReq) returns (google.protobuf.Empty) {}
  rpc GetAppKeyByKey(GetAppKeyByKeyReq) returns (AppKeyInfo) {}
  // --- exploration ---
  rpc GetExplorationAppList(GetExplorationAppListReq) returns (ExplorationAppList){}
  rpc ChangeExplorationAppFavorite(ChangeExplorationAppFavoriteReq) returns (google.protobuf.Empty){}
  rpc RecordAppHistory(RecordAppHistoryReq) returns (google.protobuf.Empty) {}
  // --- app ---
  rpc PublishApp(PublishAppReq) returns (google.protobuf.Empty){}
  rpc UnPublishApp(UnPublishAppReq) returns (google.protobuf.Empty){}
  rpc GetAppList(GetAppListReq) returns (AppList){}
  rpc GetAppListByIds(GetAppListByIdsReq) returns (AppList){}
  rpc DeleteApp(DeleteAppReq) returns (google.protobuf.Empty) {}
  rpc GetAppInfo(GetAppInfoReq) returns (AppInfo) {}
  rpc ConvertAppType(ConvertAppTypeReq) returns (google.protobuf.Empty) {}

  // --- url ---
  rpc AppUrlCreate(AppUrlCreateReq) returns (google.protobuf.Empty) {}
  rpc AppUrlDelete(AppUrlDeleteReq) returns (google.protobuf.Empty) {}
  rpc AppUrlUpdate(AppUrlUpdateReq) returns (google.protobuf.Empty) {}
  rpc GetAppUrlList(GetAppUrlListReq) returns (GetAppUrlListResp) {}
  rpc GetAppUrlInfoBySuffix(GetAppUrlInfoBySuffixReq) returns (AppUrlInfo) {}
  rpc AppUrlStatusSwitch(AppUrlStatusSwitchReq) returns (google.protobuf.Empty) {}

   // --- conversation ---
  rpc GetConversationByID(GetConversationByIDReq) returns (ConversationInfo) {}
  rpc CreateConversation(CreateConversationReq) returns (google.protobuf.Empty) {}

  // --- chatflowApplication ---
  rpc GetChatflowApplication(GetChatflowApplicationReq) returns (ChatflowApplicationInfo) {}
  rpc GetChatflowByApplicationID(GetChatflowByApplicationIDReq) returns (ChatflowApplicationInfo) {}
  rpc CreateChatflowApplication(CreateChatflowApplicationReq) returns (google.protobuf.Empty) {}

  // --- model statistic v2 ---
  rpc RecordModelStatisticV2(RecordModelStatisticV2Req) returns (google.protobuf.Empty) {}
  rpc GetModelStatisticV2Overview(GetModelStatisticV2ReadReq) returns (ModelStatisticV2Overview) {}
  rpc GetModelStatisticV2Chart(GetModelStatisticV2ChartReq) returns (ModelStatisticV2Chart) {}
  rpc GetModelStatisticV2List(GetModelStatisticV2ListReq) returns (GetModelStatisticV2ListResp) {}
  rpc GetModelStatisticV2UserList(GetModelStatisticV2UserListReq) returns (GetModelStatisticV2UserListResp) {}
  rpc GetModelStatisticV2AppList(GetModelStatisticV2AppListReq) returns (GetModelStatisticV2AppListResp) {}
  rpc GetModelStatisticV2Record(GetModelStatisticV2RecordReq) returns (GetModelStatisticV2RecordResp) {}
  rpc GetModelStatisticV2Select(GetModelStatisticV2SelectReq) returns (GetModelStatisticV2SelectResp) {}

  // --- app statistic v2 ---
  rpc RecordAppStatisticV2(RecordAppStatisticV2Req) returns (google.protobuf.Empty) {}
  rpc GetAppStatisticV2Overview(GetAppStatisticV2ReadReq) returns (AppStatisticV2Overview) {}
  rpc GetAppStatisticV2Chart(GetAppStatisticV2ChartReq) returns (AppStatisticV2Chart) {}
  rpc GetAppStatisticV2List(GetAppStatisticV2ListReq) returns (GetAppStatisticV2ListResp) {}
  rpc GetAppStatisticV2UserList(GetAppStatisticV2UserListReq) returns (GetAppStatisticV2UserListResp) {}
  rpc GetAppStatisticV2ModelList(GetAppStatisticV2ModelListReq) returns (GetAppStatisticV2ModelListResp) {}
  rpc GetAppStatisticV2Record(GetAppStatisticV2RecordReq) returns (GetAppStatisticV2RecordResp) {}
  rpc GetAppStatisticV2Select(GetAppStatisticV2SelectReq) returns (GetAppStatisticV2SelectResp) {}

  // --- api key statistic v2 ---
  rpc RecordAPIKeyStatisticV2(RecordAPIKeyStatisticV2Req) returns (google.protobuf.Empty) {}
  rpc GetAPIKeyStatisticV2Overview(GetAPIKeyStatisticV2ReadReq) returns (APIKeyStatisticV2Overview) {}
  rpc GetAPIKeyStatisticV2Chart(GetAPIKeyStatisticV2ChartReq) returns (APIKeyStatisticV2Chart) {}
  rpc GetAPIKeyStatisticV2List(GetAPIKeyStatisticV2ListReq) returns (GetAPIKeyStatisticV2ListResp) {}
  rpc GetAPIKeyStatisticV2AppList(GetAPIKeyStatisticV2AppListReq) returns (GetAPIKeyStatisticV2AppListResp) {}
  rpc GetAPIKeyStatisticV2ModelList(GetAPIKeyStatisticV2ModelListReq) returns (GetAPIKeyStatisticV2ModelListResp) {}
  rpc GetAPIKeyStatisticV2Record(GetAPIKeyStatisticV2RecordReq) returns (GetAPIKeyStatisticV2RecordResp) {}

  // --- conversation log ---
  rpc GetConversationLogList(GetConversationLogListReq) returns (GetConversationLogListResp) {}
  rpc GetConversationLog(GetConversationLogReq) returns (common.ConversationLog) {}
  rpc GetConversationLogByLogIds(GetConversationLogByLogIdsReq) returns (GetConversationLogByLogIdsResp) {}
  rpc RecordConversationLog(common.ConversationLog) returns (google.protobuf.Empty) {}
  rpc GetConversationLogUserSelect(GetConversationLogUserSelectReq) returns (GetConversationLogUserSelectResp) {}
  rpc DeleteConversationLogByAppId(DeleteConversationLogByAppIdReq) returns (google.protobuf.Empty) {}

  // --- conversation log export ---
  rpc ExportConversationLog(ExportConversationLogReq) returns (google.protobuf.Empty) {}
  rpc GetConversationLogExportRecordList(GetConversationLogExportRecordListReq) returns (GetConversationLogExportRecordListResp) {}
  rpc DeleteConversationLogExportRecord(DeleteConversationLogExportRecordReq) returns (google.protobuf.Empty) {}
}


// 创建API Key请求
message CreateApiKeyReq {
  string name = 1;
  string desc = 2;
  int64 expiredAt = 3;
  string userId = 4;
  string orgId = 5;
}

// 删除API Key请求
message DeleteApiKeyReq {
  string keyId = 1;
  string userId = 2;
  string orgId = 3;
}

// 更新API Key请求
message UpdateApiKeyReq {
  string keyId = 1;
  string name = 2;
  string desc = 3;
  int64 expiredAt = 4;
  string userId = 5;
  string orgId = 6;
}

// 更新API Key状态请求
message UpdateApiKeyStatusReq {
  string keyId = 1;
  bool status = 2; // false-禁用, true-启用
}

message GetApiKeyByKeyReq {
  string apiKey = 1;
}
// 列表请求
message ListApiKeysReq {
  int32 pageNo = 1;
  int32 pageSize = 2;
  repeated string orgIds = 3;
  repeated string userIds = 4;
}

// API Key信息响应
message ApiKeyInfo {
  string keyId = 1; // ID
  string key = 2; // 生成的ApiKey
  string userId = 3; // 创建者
  string name = 4; // 名称
  string desc = 5; // 描述
  int64 expiredAt = 6; // 过期时间 yyyy-mm-dd
  int64 createdAt = 7; // 创建时间 yyyy-mm-dd
  bool status = 8; // 状态
  string orgId = 9; // 组织
}


message GenAppKeyReq {
  string appId = 1;
  string appType = 2;
  string userId = 3;
  string orgId = 4;
}

message GetAppKeyListReq {
  string appId = 1;
  string appType = 2;
  string userId = 3;
  string orgId = 4;
}

message AppKeyInfoList {
  repeated AppKeyInfo info = 1;
  int64 total = 2;
}

message AppKeyInfo {
  string appKeyId = 1;
  string appKey = 2;
  string userId = 3;
  string orgId = 4;
  string appId = 5;
  string appType = 6;
  int64 createdAt = 7;
}

message DelAppKeyReq {
  string appKeyId = 1;
  string userId = 2;
  string orgId = 3;
}

message GetAppKeyByKeyReq {
  string appKey = 1;
}

// API Key列表响应
message ApiKeyInfoList {
  repeated ApiKeyInfo items = 1;
  int32 total = 2;
  int32 page = 3;
  int32 pageSize = 4;
}

message GetExplorationAppListReq{
  string name = 1;
  string appType = 2;
  string searchType = 3;
  string userId = 4;
  string orgId = 5;
}

message ExplorationAppList{
  repeated ExplorationAppInfo infos = 1;
  int64 total = 2;
}

message ExplorationAppInfo{
  string appId = 1;
  string appType = 2;
  int64 createdAt = 3;
  int64 updatedAt = 4;
  bool isFavorite = 5;
  string publishType = 6;
  string userId = 7;
  string orgId = 8;
}

message AppInfo{
  string appId = 1;
  string appType = 2;
  int64 createdAt = 3;
  string publishType = 4;
  string userId = 5;
  string orgId = 6;
}

message ChangeExplorationAppFavoriteReq{
  string appId = 1;
  string appType = 2;
  bool isFavorite = 3;
  string userId = 4;
  string orgId = 5;
}

message RecordAppHistoryReq {
  string userId = 1;
  string appId = 2;
  string appType = 3;
}

message PublishAppReq {
  string appId = 1;
  string appType = 2;
  string publishType = 3;
  string userId = 4;
  string orgId = 5;
}

message UnPublishAppReq {
  string appId = 1;
  string appType = 2;
  string userId = 3;
}

message GetAppListReq {
  string appType = 1;
  repeated string orgIds = 2;
  repeated string userIds = 3;
}

message GetAppListByIdsReq {
  repeated string appIdsList = 1;
  string appType = 2;
}

message AppList {
  repeated AppInfo infos = 1;
  int64 total = 2;
}

message DeleteAppReq {
  string appId = 1 ;
  string appType = 2;
  string userId = 3;
  string orgId = 4;
}

message GetAppInfoReq {
  string appId = 1 ;
  string appType = 2;
}

message ConvertAppTypeReq {
  string appId = 1 ;
  string oldAppType = 2;
  string newAppType = 3;
}

message AppUrlInfo {
  string urlId = 1;
  string appId = 2;
  string appType = 3;
  string name = 4;
  int64 createdAt = 5;
  int64 expiredAt = 6;
  string copyright = 7;
  bool copyrightEnable = 8;
  string privacyPolicy = 9;
  bool privacyPolicyEnable = 10;
  string disclaimer = 11;
  bool disclaimerEnable = 12;
  string suffix = 13;
  bool status = 14;
  string userId = 15;
  string orgId = 16;
  string description =17;
}

message AppUrlCreateReq {
  AppUrlInfo appUrlInfo = 1;
}

message AppUrlUpdateReq {
  AppUrlInfo appUrlInfo = 1;
}

message AppUrlDeleteReq {
  string urlId = 1;
  string userId = 2;
  string orgId = 3;
}

message GetAppUrlListReq {
  string appId = 1;
  string appType = 2;
}

message GetAppUrlListResp {
  repeated AppUrlInfo appUrlInfos = 1;
  int64 total = 2;
}

message GetAppUrlInfoBySuffixReq {
  string suffix = 1;
}

message AppUrlStatusSwitchReq {
  string urlId = 1;
  bool status = 2;
}

message GetConversationByIDReq {
  string conversionId = 1;
}

message ConversationInfo {
  string conversationId = 1;
  string appId = 2;
  string appType = 3;
  string userId = 4;
  string orgId = 5;
  string conversationName = 6;
  int64 createdAt = 7;
  int64 updatedAt = 8;
}

message CreateConversationReq {
  string appId = 1;
  string appType = 2;
  string userId = 3;
  string orgId = 4;
  string conversationName = 5;
  string conversationId = 6;
}
message GetChatflowApplicationReq {
  string workflowId = 1;
  string userId = 2;
  string orgId = 3;
}

message CreateChatflowApplicationReq {
  string workflowId = 1;
  string applicationId = 2;
  string userId = 3;
  string orgId = 4;
}

message GetChatflowByApplicationIDReq {
  string applicationId = 1;
  string userId = 2;
  string orgId = 3;
}

message ChatflowApplicationInfo {
  string applicationId = 1;
  string userId = 2;
  string orgId = 3;
  int64 createdAt = 4;
  int64 updatedAt = 5;
  string workflowId =6;
}

// ====================================================
// --- model statistic v2 ---
// 数据源：Statistic 聚合表 + ModelRecord 明细表
// viewScope: published=我发布的(按 model_creator_*); used=我使用的(按 user_id/org_id)
// ====================================================

message RecordModelStatisticV2Req {
  string traceId = 1;
  string userId = 2;
  string orgId = 3;
  string source = 4;
  string module = 5;
  string appId = 6;
  string appType = 7;
  string apiKey = 8;
  string methodPath = 9;
  string moduleCreatorUserId = 10;
  string moduleCreatorOrgId = 11;
  string modelId = 12;
  string model = 13;
  string provider = 14;
  string modelType = 15;
  string modelCreatorUserId = 16;
  string modelCreatorOrgId = 17;
  int64 promptTokens = 18;
  int64 completionTokens = 19;
  int64 totalTokens = 20;
  int64 firstTokenLatency = 21;
  int64 costs = 22;
  bool isSuccess = 23;
  bool isStream = 24;
  int64 statusCode = 25;
  string requestBody = 26;
  string responseBody = 27;
  string finishReason = 28;
  string failureReason = 29;
  string apiKeyId = 30;
}

message GetModelStatisticV2ReadReq {
  repeated string orgIds = 1;
  repeated string userIds = 2;
  string startDate = 3;
  string endDate = 4;
  repeated string modelIds = 5;
  string modelType = 6;
  string viewScope = 7; // published | used
}

message ModelStatisticV2OverviewItem {
  float value = 1;
  float periodOverPeriod = 2;
}

message ModelStatisticV2Overview {
  ModelStatisticV2OverviewItem totalTokens = 1;
  ModelStatisticV2OverviewItem promptTokens = 2;
  ModelStatisticV2OverviewItem completionTokens = 3;
  ModelStatisticV2OverviewItem dailyAvgTotalTokens = 4;
  ModelStatisticV2OverviewItem dailyAvgPromptTokens = 5;
  ModelStatisticV2OverviewItem dailyAvgCompletionTokens = 6;
  ModelStatisticV2OverviewItem callCount = 7;
  ModelStatisticV2OverviewItem callFailure = 8;
  ModelStatisticV2OverviewItem avgCosts = 9;
  ModelStatisticV2OverviewItem avgFirstTokenLatency = 10;
}

message ModelStatisticV2Trend {
  common.StatisticChart tokensUsage = 1;
  common.StatisticChart modelCalls = 2;
}

message GetModelStatisticV2ChartReq {
  repeated string orgIds = 1;
  repeated string userIds = 2;
  string startDate = 3;
  string endDate = 4;
  repeated string modelIds = 5;
  string modelType = 6;
  string viewScope = 7;
  int32 limit = 8; // 排行 TopN，默认 5
}

message ModelStatisticV2RankByModelItem {
  string modelId = 1;
  string model = 2;
  string modelType = 3;
  string modelCreatorUserId = 4;
  string modelCreatorOrgId = 5;
  int64 totalTokens = 6;
  string provider = 7;
}

message ModelStatisticV2RankByUserItem {
  string userId = 1;
  string userName = 2;
  string avatar = 3;
  string orgName = 4;
  int64 totalTokens = 5;
  string orgId = 6;
}

message ModelStatisticV2RankByOrgItem {
  string orgId = 1;
  string orgName = 2;
  int64 totalTokens = 3;
}

message ModelStatisticV2Rank {
  repeated ModelStatisticV2RankByModelItem byModel = 1;
  repeated ModelStatisticV2RankByUserItem byUser = 2;
  repeated ModelStatisticV2RankByOrgItem byOrg = 3;
}

message ModelStatisticV2Chart {
  ModelStatisticV2Trend trend = 1;
  ModelStatisticV2Rank rank = 2;
}

// 列表通用度量（列表行复用）
message ModelStatisticV2Metrics {
  int64 totalTokens = 1;
  int64 promptTokens = 2;
  int64 completionTokens = 3;
  int32 callCount = 4;
  int32 callFailure = 5;
  float failureRate = 6;
  float avgCosts = 7;             // 非流式 ms
  float avgFirstTokenLatency = 8; // 流式 ms
}

message GetModelStatisticV2ListReq {
  repeated string orgIds = 1;
  repeated string userIds = 2;
  string startDate = 3;
  string endDate = 4;
  repeated string modelIds = 5;
  string modelType = 6;
  string viewScope = 7;
  int32 pageNo = 8;
  int32 pageSize = 9;
  string sortField = 10;
  string sortOrder = 11; // asc | desc
}

message ModelStatisticV2ListItem {
  string modelId = 1;
  string model = 2;
  string provider = 3;
  string modelType = 4;
  string modelCreatorUserId = 5;
  string modelCreatorOrgId = 6;
  ModelStatisticV2Metrics metrics = 7;
}

message GetModelStatisticV2ListResp {
  repeated ModelStatisticV2ListItem items = 1;
  int32 total = 2;
}

message GetModelStatisticV2UserListReq {
  repeated string orgIds = 1;
  repeated string userIds = 2;
  string startDate = 3;
  string endDate = 4;
  repeated string modelIds = 5;
  string modelType = 6;
  string viewScope = 7;
  string modelId = 8; // 固定模型
  int32 pageNo = 9;
  int32 pageSize = 10;
  string sortField = 11;
  string sortOrder = 12;
}

message ModelStatisticV2UserListItem {
  string modelId = 1;
  string model = 2;
  string provider = 3;
  string modelType = 4;
  string userId = 5;
  string orgId = 6;
  ModelStatisticV2Metrics metrics = 7;
  string modelCreatorUserId = 8;
  string modelCreatorOrgId = 9;
}

message GetModelStatisticV2UserListResp {
  repeated ModelStatisticV2UserListItem items = 1;
  int32 total = 2;
}

message GetModelStatisticV2AppListReq {
  repeated string orgIds = 1;
  repeated string userIds = 2;
  string startDate = 3;
  string endDate = 4;
  repeated string modelIds = 5;
  string modelType = 6;
  string viewScope = 7;
  string modelId = 8; // 固定模型
  int32 pageNo = 9;
  int32 pageSize = 10;
  string sortField = 11;
  string sortOrder = 12;
}

message ModelStatisticV2AppListItem {
  string modelId = 1;
  string model = 2;
  string provider = 3;
  string modelType = 4;
  string source = 5;
  string module = 6;
  string appId = 7;
  string appType = 8;
  string moduleCreatorUserId = 9;
  string moduleCreatorOrgId = 10;
  ModelStatisticV2Metrics metrics = 11;
  string modelCreatorUserId = 12;
  string modelCreatorOrgId = 13;
}

message GetModelStatisticV2AppListResp {
  repeated ModelStatisticV2AppListItem items = 1;
  int32 total = 2;
}

message GetModelStatisticV2RecordReq {
  repeated string orgIds = 1;
  repeated string userIds = 2;
  string startDate = 3;
  string endDate = 4;
  repeated string modelIds = 5;
  string modelType = 6;
  string viewScope = 7;
  string modelId = 8; // 可选，筛单模型
  int32 pageNo = 9;
  int32 pageSize = 10;
  string sortField = 11;
  string sortOrder = 12;
}

message ModelStatisticV2RecordItem {
  uint32 id = 1;
  string traceId = 2;
  string modelId = 3;
  string model = 4;
  string provider = 5;
  string modelType = 6;
  string appId = 7;       // BFF 富化为 appName
  string orgId = 8;       // BFF 富化为 userOrgName / projectName
  string userId = 9;
  int64 totalTokens = 10;
  string calledAt = 11;
  bool isSuccess = 12;
  int64 statusCode = 13;
  string appType = 14;    // 用于 BFF 查 appName
  int64 promptTokens = 15;
  int64 completionTokens = 16;
  string failureReason = 17;
  string requestBody = 18;
  string responseBody = 19;
  string finishReason = 20;
  int64 firstTokenLatency = 21; // 本次流式耗时 ms（非平均）
  int64 costs = 22;             // 本次非流式耗时 ms（非平均）
  string modelCreatorUserId = 23; // 模型发布者，BFF 富化为 userName
  string modelCreatorOrgId = 24;  // 模型所属组织，BFF 富化为 orgName
  string source = 25;
  string module = 26;
  string moduleCreatorUserId = 27; // 应用作者，BFF 富化为 userName
  string moduleCreatorOrgId = 28;  // 应用所属组织，BFF 富化为 orgName
}

message GetModelStatisticV2RecordResp {
  repeated ModelStatisticV2RecordItem items = 1;
  int32 total = 2;
}

message GetModelStatisticV2SelectReq {
  repeated string orgIds = 1;
  repeated string userIds = 2;
  string modelType = 3;
  string viewScope = 4;
}

message ModelStatisticV2SelectItem {
  string modelId = 1;
  string model = 2;
  string provider = 3;
  string modelType = 4;
  string modelCreatorUserId = 5;
  string modelCreatorOrgId = 6;
}

message GetModelStatisticV2SelectResp {
  repeated ModelStatisticV2SelectItem items = 1;
}

// ====================================================
// --- app statistic v2 ---
// viewScope: published=我发布的(按 module_creator_*); used=我使用的(按 user_id/org_id)
// ====================================================

message RecordAppStatisticV2Req {
  string traceId = 1;
  string userId = 2;
  string orgId = 3;
  string source = 4;
  string module = 5;
  string appId = 6;
  string appType = 7;
  string moduleCreatorUserId = 8;
  string moduleCreatorOrgId = 9;
  int64 firstTokenLatency = 10;
  int64 costs = 11;
  bool isSuccess = 12;
  bool isStream = 13;
  int64 statusCode = 14;
  string requestBody = 15;
  string responseBody = 16;
  string finishReason = 17;
  string failureReason = 18;
  string question = 19;
  string answer = 20;
}

message GetAppStatisticV2ReadReq {
  repeated string orgIds = 1;
  repeated string userIds = 2;
  string startDate = 3;
  string endDate = 4;
  string module = 5;
  repeated string apps = 6;
  string viewScope = 7;
  string source = 8; // 调用来源筛选 web|openapi|webURL，空=全部
}

message AppStatisticV2OverviewItem {
  float value = 1;
  float periodOverPeriod = 2;
}

message AppStatisticV2Overview {
  AppStatisticV2OverviewItem callCount = 1;
  AppStatisticV2OverviewItem callFailure = 2;
  AppStatisticV2OverviewItem dailyAvgCallCount = 3;
  AppStatisticV2OverviewItem dailyAvgCallFailure = 4;
  AppStatisticV2OverviewItem dailyAvgStreamCount = 5;
  AppStatisticV2OverviewItem dailyAvgNonStreamCount = 6;
  AppStatisticV2OverviewItem avgFirstTokenLatency = 7;
  AppStatisticV2OverviewItem avgCosts = 8;
  AppStatisticV2OverviewItem streamCount = 9;
  AppStatisticV2OverviewItem nonStreamCount = 10;
}

message GetAppStatisticV2ChartReq {
  repeated string orgIds = 1;
  repeated string userIds = 2;
  string startDate = 3;
  string endDate = 4;
  string module = 5;
  repeated string apps = 6;
  string viewScope = 7;
  int32 limit = 8;
  string source = 9; // 调用来源筛选 web|openapi|webURL，空=全部
}

message AppStatisticV2Trend {
  common.StatisticChart callResult = 1;
  common.StatisticChart callTrend = 2;
}

message AppStatisticV2RankItem {
  string appId = 1;
  string appType = 2;
  string moduleCreatorUserId = 3;
  string moduleCreatorOrgId = 4;
  int32 callCount = 5;
}

message AppStatisticV2Rank {
  repeated AppStatisticV2RankItem byAgent = 1;
  repeated AppStatisticV2RankItem byWorkflow = 2;
  repeated AppStatisticV2RankItem byChatflow = 3;
  repeated AppStatisticV2RankItem byRag = 4;
  repeated AppStatisticV2RankItem byDigitalEmployee = 5;
}

message AppStatisticV2Chart {
  AppStatisticV2Trend trend = 1;
  AppStatisticV2Rank rank = 2;
}

// AppStatisticV2Metrics 聚合调用统计指标（list 接口）；avgCosts / avgFirstTokenLatency 为平均值。
message AppStatisticV2Metrics {
  int64 totalTokens = 1;
  int64 promptTokens = 2;
  int64 completionTokens = 3;
  int32 callCount = 4;
  int32 callFailure = 5;
  float failureRate = 6;
  float avgCosts = 7;
  float avgFirstTokenLatency = 8;
  int32 streamCount = 9;
  int32 nonStreamCount = 10;
}

message GetAppStatisticV2ListReq {
  repeated string orgIds = 1;
