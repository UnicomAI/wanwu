syntax = "proto3";

package iam_service;

import "google/protobuf/empty.proto";
import "proto/err-code/err-status.proto";

option go_package = "github.com/UnicomAI/wanwu/api/proto/iam-service";

service IAMService {

  // --- user ---

  // 获取用户列表（用于下拉选择，不在组织中的用户） [EN] Get a list of users (for drop-down selection, users not in the organization)
  rpc GetUserSelectNotInOrg(GetUserSelectNotInOrgReq) returns (Select) {}
  // 获取用户列表 by userIDs [EN] Get user list by userIDs
  rpc GetUserSelectByUserIDs(GetUserSelectByUserIDsReq) returns (Select) {}
  // 获取用户列表 [EN] Get user list
  rpc GetUserList(GetUserListReq) returns (GetUserListResp) {}
  // 获取用户 [EN] Get user
  rpc GetUserInfo(GetUserInfoReq) returns (UserInfo) {}
  // 创建用户 [EN] Create user
  rpc CreateUser(CreateUserReq) returns (IDName) {}
  // 编辑用户 [EN] Edit user
  rpc UpdateUser(UpdateUserReq) returns (google.protobuf.Empty) {}
  // 删除用户 [EN] Delete user
  rpc DeleteUser(DeleteUserReq) returns (google.protobuf.Empty) {}
  // 修改用户状态 [EN] Modify user status
  rpc ChangeUserStatus(ChangeUserStatusReq) returns (google.protobuf.Empty) {}
  // 更新用户密码 [EN] Update user password
  rpc UpdateUserPassword(UpdateUserPasswordReq) returns (google.protobuf.Empty) {}
  // 重置用户密码 [EN] Reset user password
  rpc ResetUserPassword(ResetUserPasswordReq) returns (google.protobuf.Empty) {}
  // 获取用户权限 [EN] Get user permissions
  rpc GetUserPermission(GetUserPermissionReq) returns (UserPermission) {}
  // 修改用户语言 [EN] Modify user language
  rpc ChangeUserLanguage(ChangeUserLanguageReq) returns (google.protobuf.Empty){}
  // 上传用户头像 [EN] Upload user avatar
  rpc UpdateUserAvatar(UpdateUserAvatarReq) returns (google.protobuf.Empty){}

  // --- org ---

  // 获取组织列表（用于下拉选择） [EN] Get list of organizations (for drop-down selection)
  rpc GetOrgSelect(GetOrgSelectReq) returns (Select) {}
  // 获取组织列表 [EN] Get list of organizations
  rpc GetOrgList(GetOrgListReq) returns (GetOrgListResp) {}
  // 获取组织 [EN] Get organization
  rpc GetOrgInfo(GetOrgInfoReq) returns (OrgInfo) {}
  // 通过orgIds获取组织信息 [EN] Get organization information through orgIds
  rpc GetOrgByOrgIDs(GetOrgByOrgIDsReq) returns (GetOrgByOrgIDsResp) {}
  // 获取子组织信息 [EN] Get sub-organization information
  rpc GetOrgAndSubOrgSelectByUser(GetOrgAndSubOrgSelectByUserReq) returns (GetOrgAndSubOrgSelectByUserResp) {}
  // 创建组织 [EN] Create an organization
  rpc CreateOrg(CreateOrgReq) returns (IDName) {}
  // 编辑组织 [EN] Edit organization
  rpc UpdateOrg(UpdateOrgReq) returns (google.protobuf.Empty) {}
  // 删除组织 [EN] Delete organization
  rpc DeleteOrg(DeleteOrgReq) returns (google.protobuf.Empty) {}
  // 修改组织状态 [EN] Modify organization status
  rpc ChangeOrgStatus(ChangeOrgStatusReq) returns (google.protobuf.Empty) {}

  // 增加组织用户 [EN] Add organizational users
  rpc AddOrgUser(AddOrgUserReq) returns (google.protobuf.Empty) {}
  // 移除组织用户 [EN] Remove organization user
  rpc RemoveOrgUser(RemoveOrgUserReq) returns (google.protobuf.Empty) {}

  // --- role ---

  // 获取角色列表（用于下拉选择） [EN] Get a list of roles (for drop-down selection)
  rpc GetRoleSelect(GetRoleSelectReq) returns (GetRoleSelectResp) {}
  // 获取角色列表 [EN] Get role list
  rpc GetRoleList(GetRoleListReq) returns (GetRoleListResp) {}
  // 获取角色 [EN] Get role
  rpc GetRoleInfo(GetRoleInfoReq) returns (RoleInfo) {}
  // 创建角色 [EN] Create a role
  rpc CreateRole(CreateRoleReq) returns (RoleIDName) {}
  // 编辑角色 [EN] Edit role
  rpc UpdateRole(UpdateRoleReq) returns (google.protobuf.Empty) {}
  // 删除角色 [EN] Delete role
  rpc DeleteRole(DeleteRoleReq) returns (google.protobuf.Empty) {}
  // 修改角色状态 [EN] Modify character status
  rpc ChangeRoleStatus(ChangeRoleStatusReq) returns (google.protobuf.Empty) {}

  // --- login ---
  
  // 获取验证码 [EN] Get verification code
  rpc GetCaptcha(GetCaptchaReq) returns (GetCaptchaResp) {}
  // 登录 [EN] Log in
  rpc Login(LoginReq) returns (LoginResp) {}
  // 一阶段登录 [EN] One stage login
  rpc LoginByEmail(LoginByEmailReq) returns (LoginByEmailResp) {}
  // 登录发送邮箱验证码 [EN] Log in and send email verification code
  rpc LoginSendEmailCode(LoginSendEmailCodeReq)returns (google.protobuf.Empty) {}
  // 二阶段登录邮箱校验 [EN] Two-stage login email verification
  rpc LoginEmailCheck(LoginEmailCheckReq) returns (LoginResp) {}
  // 二阶段登录重置密码与邮箱校验 [EN] Two-stage login, password reset and email verification
  rpc ChangeUserPasswordByEmail(ChangeUserPasswordByEmailReq) returns (LoginResp) {}

  // --- register ---
  // 邮箱注册用户 [EN] Email registered user
  rpc RegisterByEmail(RegisterByEmailReq) returns (google.protobuf.Empty) {}
  // 邮箱注册发送邮件 [EN] Email registration to send emails
  rpc RegisterSendEmailCode(RegisterSendEmailCodeReq) returns (google.protobuf.Empty) {}

  // --- reset password ---
  // 重置密码邮箱验证码发送 [EN] Reset password email verification code sent
  rpc ResetPasswordSendEmailCode(ResetPasswordSendEmailCodeReq) returns (google.protobuf.Empty) {}
  // 邮箱重置密码 [EN] Email password reset
  rpc ResetPasswordByEmail(ResetPasswordByEmailReq) returns (google.protobuf.Empty) {}

  // --- oauth ---
  // 创建OAuth应用 [EN] Create an OAuth application
  rpc CreateOauthApp(CreateOauthAppReq) returns (google.protobuf.Empty);
  // 删除OAuth应用 [EN] Delete OAuth application
  rpc DeleteOauthApp(DeleteOauthAppReq) returns (google.protobuf.Empty);
  // 更新OAuth应用 [EN] Update OAuth application
  rpc UpdateOauthApp(UpdateOauthAppReq) returns (google.protobuf.Empty);
  // 获取OAuth应用列表 [EN] Get OAuth application list
  rpc GetOauthAppList(GetOauthAppListReq) returns (OauthAppListResp);
  // 更新OAuth应用状态 [EN] Update OAuth application status
  rpc UpdateOauthAppStatus(UpdateOauthAppStatusReq) returns (google.protobuf.Empty);
  // 根据clientID获取oauth app信息 [EN] Get oauth app information based on clientID
  rpc GetOauthApp(GetOauthAppReq) returns (OauthApp);
}

message Perm {
  string perm = 1;
}

message IDName {
  string id = 1;
  string name = 2;
  err_code.Status nameStatus = 3;
}

message Select {
  repeated IDName selects = 1;
}

// --- user ---

message UserInfo {
  string userId = 1;
  bool status = 2;
  string userName = 3;
  string nickName = 4;
  string gender = 5;
  string phone = 6;
  string email = 7;
  string company = 8;
  string remark = 9;
  int64 createdAt = 10;
  IDName creator = 11;
  repeated UserOrg orgs = 12;
  string language = 13;
  string avatarPath = 14;
}

message UserOrg {
  IDName org = 1;
  repeated RoleIDName roles = 2;
}

message GetUserSelectNotInOrgReq {
  string orgId = 1;
  string userName = 2;
}

message GetUserSelectByUserIDsReq {
  repeated string userIds = 1;
}

message GetUserListReq {
  string orgId = 1;
  string userName = 2;
  int32 pageNo = 3;
  int32 pageSize = 4;
}

message GetUserListResp {
  repeated UserInfo users = 1;
  int64 total = 2;
  int32 pageNo = 3;
  int32 pageSize = 4;
}

message GetUserInfoReq {
  string userId = 1;
  string orgId = 2;
}

message CreateUserReq {
  string creatorId = 1;
  string orgId = 2;
  string userName = 3;
  string nickName = 4;
  string gender = 5;
  string phone = 6;
  string company = 7;
  string remark = 8;
  string password = 9;
  repeated string roleIds = 10;
}

message UpdateUserReq {
  string userId = 1;
  string orgId = 2;
  string userName = 3;
  string nickName = 4;
  string gender = 5;
  string phone = 6;
  string company = 7;
  string remark = 8;
  repeated string roleIds = 9;
}

message DeleteUserReq {
  string userId = 1;
}

message ChangeUserStatusReq {
  string userId = 1;
  string orgId = 2;
  bool status = 3;
}

message UpdateUserPasswordReq {
  string userId = 1;
  string oldPassword = 2;
  string newPassword = 3;
}

message ResetUserPasswordReq {
  string userId = 1;
  string password = 2;
}

message GetUserPermissionReq {
  string userId = 1;
  string orgId = 2;
}

message UserPermission {
  bool isAdmin = 1;
  bool isSystem = 2;
  IDName org = 3;
  repeated RoleIDName roles = 4;
  repeated Perm perms = 5;
  int64 lastUpdatePasswordAt = 6;
}

message ChangeUserLanguageReq{
  string userId = 1;
  string language = 2;
}

message  UpdateUserAvatarReq{
  string userId =1;
  string avatarPath = 2;
}

// --- org ---

message OrgInfo {
  string orgId = 1;
  string name = 2;
  string remark = 3;
  bool status = 4;
  int64 createdAt = 5;
  IDName creator = 6;
}

message GetOrgByOrgIDsReq {
  repeated string orgIds = 1;
}

message GetOrgByOrgIDsResp {
  repeated IDName orgs = 1;
}

message GetOrgAndSubOrgSelectByUserReq {
  string userId = 1;
  string orgId = 2;
}

message GetOrgAndSubOrgSelectByUserResp {
  repeated IDName orgs = 1;
}

message GetOrgSelectReq {
  string userId = 1;
}

message GetOrgListReq {
  string parentId = 1;
  string name = 2;
  int32 pageNo = 3;
  int32 pageSize = 4;
}

message GetOrgListResp {
  repeated OrgInfo orgs = 1;
  int64 total = 2;
  int32 pageNo = 3;
  int32 pageSize = 4;
}

message GetOrgInfoReq {
  string parentId = 1;
  string orgId = 2;
}

message CreateOrgReq {
  string parentId = 1;
  string creatorId = 2;
  string name = 3;
  string remark = 4;
}

message UpdateOrgReq {
  string parentId = 1;
  string orgId = 2;
  string name = 3;
  string remark = 4;
}

message DeleteOrgReq {
  string parentId = 1;
  string orgId = 2;
}

message ChangeOrgStatusReq {
  string parentId = 1;
  string orgId = 2;
  bool status = 3;
}

message AddOrgUserReq {
  string parentId = 1;
  string orgId = 2;
  string userId = 3;
  string roleId = 4;
}

message RemoveOrgUserReq {
  string parentId = 1;
  string orgId = 2;
  string userId = 3;
}

// --- role ---

message RoleIDName {
  string id = 1;
  string name = 2;
  bool isAdmin = 3;
  bool isSystem = 4;
}

message RoleInfo {
  string roleId = 1;
  string name = 2;
  string remark = 3;
  bool isAdmin = 4;
  bool isSystem = 5;
  bool status = 6;
  int64 createdAt = 7;
  IDName creator = 8;
  repeated Perm perms = 9;
}

message GetRoleSelectReq {
  string orgId = 1;
}

message GetRoleSelectResp {
  repeated RoleIDName roles = 1;
}

message GetRoleListReq {
  string orgId = 1;
  string name = 2;
  int32 pageNo = 3;
  int32 pageSize = 4;
}

message GetRoleListResp {
  repeated RoleInfo roles = 1;
  int64 total = 2;
  int32 pageNo = 3;
  int32 pageSize = 4;
}

message GetRoleInfoReq {
  string orgId = 1;
  string roleId = 2;
}

message CreateRoleReq {
  string creatorId = 1;
  string orgId = 2;
  string name = 3;
  string remark = 4;
  repeated Perm perms = 5;
}

message UpdateRoleReq {
  string orgId = 1;
  string roleId = 2;
  string name = 3;
  string remark = 4;
  repeated Perm perms = 5;
}

message DeleteRoleReq {
  string orgId = 1;
  string roleId = 2;
}

message ChangeRoleStatusReq {
  string orgId = 1;
  string roleId = 2;
  bool status = 3;
}

// --- login ---

message GetCaptchaReq {
  string key = 1; // 客户端key [EN] client key
}

message GetCaptchaResp {
  string key = 1; // 客户端key [EN] client key
  string b64 = 2; // 验证码png图片base64字符串 [EN] Verification code png picture base64 string
}

message LoginReq {
  string userName = 1; // 用户名 [EN] username
  string password = 2; // 密码 [EN] password
  string key = 3; // 客户端key [EN] client key
  string code = 4; // 验证码 [EN] Verification code
  string language = 5; //用户语言 [EN] User language
}

message LoginResp {
  UserInfo user = 1;
  UserPermission permission = 2;
}

message LoginByEmailReq {
  string userName = 1; // 用户名 [EN] username
  string password = 2; // 密码 [EN] password
  string key = 3; // 客户端key [EN] client key
  string code = 4; // 验证码 [EN] Verification code
}

message LoginByEmailResp {
  string userId = 1;
  bool isEmailCheck = 2;
  int64 lastUpdatePasswordAt = 3;
}

message LoginSendEmailCodeReq{
  string email = 1;
}

message LoginEmailCheckReq{
  string userId = 1;
  string email = 2;
  string code = 3;
  string language = 4; //用户语言 [EN] User language
}

message ChangeUserPasswordByEmailReq{
  string userId = 1;
  string oldPassword = 2;
  string newPassword = 3;
  string email = 4;
  string code = 5;
  string language = 6; //用户语言 [EN] User language
}

// --- register ---

message RegisterByEmailReq{
  string userName = 1;
  string email = 2;
  string code = 3;
}

message RegisterSendEmailCodeReq {
  string email = 1;
  string userName = 2;
}

// --- reset password ---
message ResetPasswordSendEmailCodeReq{
  string email = 1;
}

message ResetPasswordByEmailReq{
  string email = 1;
  string password = 2;
  string code = 3;
}

// --- oauth ---
message CreateOauthAppReq{
  string userId = 1;
  string name = 2;
  string desc = 3;
  string redirectUri = 4;
}

message DeleteOauthAppReq{
  string clientId = 1;
}

message UpdateOauthAppReq{
  string clientId = 1;
  string name = 2;
  string desc = 3;
  string redirectUri = 4;
}

message GetOauthAppListReq{
  string userId = 1;
  string name = 2;
  int32 pageNo = 3;
  int32 pageSize = 4;
}

message OauthAppListResp{
  repeated OauthApp apps = 1;
  int64 total = 2;
  int32 pageNo = 3;
  int32 pageSize = 4;
}

message OauthApp{
  string clientId = 1;
  string name = 2;
  string desc = 3;
  string redirectUri = 4;
  string clientSecret = 5;
  bool status = 6;
  int64 createdAt = 7;
  int64 updatedAt = 8;
}

message UpdateOauthAppStatusReq{
  string clientId = 1;
  bool status = 2;
}

message GetOauthAppReq{
  string clientId = 1;
}