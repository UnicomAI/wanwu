name: Build and Push Docker Images

on:
  push:
    branches:
      - main
      - docs/translation-plan 
    paths:
      - 'internal/**'
      - 'cmd/**'
      - 'pkg/**'
      - 'web/**'
      - 'workflow-frontend/**'
      - 'rag/**'
      - 'agent/**'
      - 'Dockerfile.*'
      - 'configs/**'
      - '.github/workflows/build-and-push.yml'
  workflow_dispatch:  # Allow manual trigger

env:
  DOCKER_USERNAME: safvr
  WANWU_ARCH: amd64
  WANWU_VERSION: v0.2.7



jobs:
  detect-changes:
    runs-on: self-hosted
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.force-frontend.outputs.frontend }}
      rag: ${{ steps.filter.outputs.rag }}
      agent: ${{ steps.filter.outputs.agent }}
      frontend_files: ${{ steps.filter.outputs.frontend_files }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch full history for proper comparison
      
      - name: Get previous commit SHA
        id: prev-commit
        run: |
          echo "Event name: ${{ github.event_name }}"
          echo "Event before: ${{ github.event.before }}"
          echo "Current SHA: ${{ github.sha }}"
          
          if [ "${{ github.event_name }}" == "push" ] && [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            echo "sha=${{ github.event.before }}" >> $GITHUB_OUTPUT
            echo "Using github.event.before: ${{ github.event.before }}"
          else
            # For workflow_dispatch or when before is empty/null, compare against HEAD^
            PREV_SHA=$(git rev-parse HEAD^ 2>/dev/null || echo "")
            if [ -n "$PREV_SHA" ]; then
              echo "sha=$PREV_SHA" >> $GITHUB_OUTPUT
              echo "Using HEAD^: $PREV_SHA"
            else
              # If no previous commit, use empty string (will compare against empty tree)
              echo "sha=" >> $GITHUB_OUTPUT
              echo "No previous commit found - will detect all files as changed"
            fi
          fi
      
      - name: Debug - Show changed files
        run: |
          echo "Current commit: ${{ github.sha }}"
          echo "Previous commit: ${{ steps.prev-commit.outputs.sha }}"
          echo "Event name: ${{ github.event_name }}"
          echo "Event before: ${{ github.event.before }}"
          echo ""
          echo "Changed files:"
          if [ -n "${{ steps.prev-commit.outputs.sha }}" ]; then
            git diff --name-only ${{ steps.prev-commit.outputs.sha }} ${{ github.sha }} || echo "No diff available"
            echo ""
            echo "Files matching workflow-frontend/**:"
            git diff --name-only ${{ steps.prev-commit.outputs.sha }} ${{ github.sha }} | grep "^workflow-frontend/" || echo "No workflow-frontend files changed"
          else
            git diff --name-only HEAD~1 HEAD || echo "No diff available"
            echo ""
            echo "Files matching workflow-frontend/**:"
            git diff --name-only HEAD~1 HEAD | grep "^workflow-frontend/" || echo "No workflow-frontend files changed"
          fi
      
      - name: Set filter base (ensure valid commit)
        id: filter-base
        run: |
          BASE_SHA="${{ steps.prev-commit.outputs.sha }}"
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            # Use HEAD^ as fallback
            BASE_SHA=$(git rev-parse HEAD^ 2>/dev/null || git rev-parse HEAD)
            echo "Using fallback base: $BASE_SHA"
          fi
          echo "sha=$BASE_SHA" >> $GITHUB_OUTPUT
          echo "Final base SHA: $BASE_SHA"
      
      - uses: dorny/paths-filter@v2
        id: filter
        with:
          base: ${{ steps.filter-base.outputs.sha }}
          list-files: shell
          filters: |
            backend:
              - 'internal/**'
              - 'cmd/**'
              - 'pkg/**'
              - 'proto/**'
              - 'api/**'
              - 'Dockerfile.backend'
              - 'go.mod'
              - 'go.sum'
            frontend:
              - 'web/**'
              - 'workflow-frontend/**'
              - 'Dockerfile.frontend'
              - 'configs/middleware/nginx/conf.d/**'
            rag:
              - 'rag/**'
              - 'Dockerfile.rag'
              - 'Dockerfile.rag-base'
            agent:
              - 'agent/**'
              - 'Dockerfile.agent'
              - 'Dockerfile.agent-base'
      
      - name: Debug - Show path filter results
        run: |
          echo "Path filter outputs:"
          echo "  backend: ${{ steps.filter.outputs.backend }}"
          echo "  frontend: ${{ steps.filter.outputs.frontend }}"
          echo "  rag: ${{ steps.filter.outputs.rag }}"
          echo "  agent: ${{ steps.filter.outputs.agent }}"
          echo ""
          echo "Frontend files that matched:"
          echo "${{ steps.filter.outputs.frontend_files }}"
      
      - name: Force frontend build if workflow-frontend files changed
        id: force-frontend
        run: |
          BASE_SHA="${{ steps.filter-base.outputs.sha }}"
          CURRENT_SHA="${{ github.sha }}"
          
          # Check if any workflow-frontend files changed
          if git diff --name-only "$BASE_SHA" "$CURRENT_SHA" | grep -q "^workflow-frontend/"; then
            echo "workflow-frontend files detected in changes - forcing frontend build"
            echo "force=true" >> $GITHUB_OUTPUT
            FRONTEND_BUILD="true"
          else
            echo "No workflow-frontend files in changes"
            echo "force=false" >> $GITHUB_OUTPUT
            FRONTEND_BUILD="${{ steps.filter.outputs.frontend }}"
          fi
          
          # Set final frontend output (path filter OR forced)
          if [ "$FRONTEND_BUILD" = "true" ] || [ "${{ steps.filter.outputs.frontend }}" = "true" ]; then
            echo "frontend=true" >> $GITHUB_OUTPUT
          else
            echo "frontend=false" >> $GITHUB_OUTPUT
          fi

  build-backend:
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Prepare dockerignore
        run: |
          cp .dockerignore.backend .dockerignore

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.backend
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.DOCKER_USERNAME }}/wanwu-backend:latest
            ${{ env.DOCKER_USERNAME }}/wanwu-backend:${{ github.sha }}
          build-args: |
            WANWU_ARCH=${{ env.WANWU_ARCH }}
            WANWU_VERSION=${{ env.WANWU_VERSION }}
          cache-from: type=registry,ref=${{ env.DOCKER_USERNAME }}/wanwu-backend:buildcache
          cache-to: type=registry,ref=${{ env.DOCKER_USERNAME }}/wanwu-backend:buildcache,mode=max

  build-frontend:
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Prepare dockerignore
        run: |
          cp .dockerignore.frontend .dockerignore

      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.frontend
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.DOCKER_USERNAME }}/wanwu-frontend:latest
            ${{ env.DOCKER_USERNAME }}/wanwu-frontend:${{ github.sha }}
          build-args: |
            WANWU_ARCH=${{ env.WANWU_ARCH }}
          cache-from: type=registry,ref=${{ env.DOCKER_USERNAME }}/wanwu-frontend:buildcache
          cache-to: type=registry,ref=${{ env.DOCKER_USERNAME }}/wanwu-frontend:buildcache,mode=max

  build-rag-base:
    needs: detect-changes
    if: needs.detect-changes.outputs.rag == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Prepare dockerignore
        run: |
          cp .dockerignore.rag .dockerignore

      - name: Build and push rag-base
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.rag-base
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.DOCKER_USERNAME }}/rag-base:latest
            ${{ env.DOCKER_USERNAME }}/rag-base:${{ github.sha }}
          cache-from: type=registry,ref=${{ env.DOCKER_USERNAME }}/rag-base:buildcache
          cache-to: type=registry,ref=${{ env.DOCKER_USERNAME }}/rag-base:buildcache,mode=max

  build-rag:
    needs: [detect-changes, build-rag-base]
    if: |
      always() &&
      (needs.detect-changes.outputs.rag == 'true' || github.event_name == 'workflow_dispatch') &&
      (needs.build-rag-base.result == 'success' || needs.build-rag-base.result == 'skipped')
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Prepare dockerignore
        run: |
          cp .dockerignore.rag .dockerignore

      - name: Build and push rag
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.rag
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.DOCKER_USERNAME }}/wanwu-rag:latest
            ${{ env.DOCKER_USERNAME }}/wanwu-rag:${{ github.sha }}
          cache-from: type=registry,ref=${{ env.DOCKER_USERNAME }}/wanwu-rag:buildcache
          cache-to: type=registry,ref=${{ env.DOCKER_USERNAME }}/wanwu-rag:buildcache,mode=max

  build-agent-base:
    needs: detect-changes
    if: needs.detect-changes.outputs.agent == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Prepare dockerignore
        run: |
          cp .dockerignore.agent-base .dockerignore

      - name: Build and push agent-base
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.agent-base
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.DOCKER_USERNAME }}/agent-base:latest
            ${{ env.DOCKER_USERNAME }}/agent-base:${{ github.sha }}
          cache-from: type=registry,ref=${{ env.DOCKER_USERNAME }}/agent-base:buildcache
          cache-to: type=registry,ref=${{ env.DOCKER_USERNAME }}/agent-base:buildcache,mode=max

  build-agent:
    needs: [detect-changes, build-agent-base]
    if: |
      always() &&
      (needs.detect-changes.outputs.agent == 'true' || github.event_name == 'workflow_dispatch') &&
      (needs.build-agent-base.result == 'success' || needs.build-agent-base.result == 'skipped')
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Prepare dockerignore
        run: |
          cp .dockerignore.agent-base .dockerignore

      - name: Build and push agent
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.agent
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.DOCKER_USERNAME }}/agent:latest
            ${{ env.DOCKER_USERNAME }}/agent:${{ github.sha }}
          cache-from: type=registry,ref=${{ env.DOCKER_USERNAME }}/agent:buildcache
          cache-to: type=registry,ref=${{ env.DOCKER_USERNAME }}/agent:buildcache,mode=max

  trigger-dokploy:
    needs: [detect-changes, build-backend, build-frontend, build-rag, build-agent]
    if: |
      always() &&
      (
        (needs.build-backend.result == 'success') ||
        (needs.build-frontend.result == 'success') ||
        (needs.build-rag.result == 'success') ||
        (needs.build-agent.result == 'success')
      )
    runs-on: self-hosted
    steps:
      - name: Summary of built images
        run: |
          echo "✅ Images built and pushed successfully!"
          echo ""
          echo "Change detection results:"
          echo "  - Backend changes: ${{ needs.detect-changes.outputs.backend }}"
          echo "  - Frontend changes: ${{ needs.detect-changes.outputs.frontend }}"
          echo "  - RAG changes: ${{ needs.detect-changes.outputs.rag }}"
          echo "  - Agent changes: ${{ needs.detect-changes.outputs.agent }}"
          echo ""
          echo "Files that triggered frontend build:"
          echo "${{ needs.detect-changes.outputs.frontend_files }}"
          echo ""
          echo "Built images:"
          if [ "${{ needs.build-backend.result }}" == "success" ]; then
            echo "  - safvr/wanwu-backend:latest"
          fi
          if [ "${{ needs.build-frontend.result }}" == "success" ]; then
            echo "  - safvr/wanwu-frontend:latest"
          fi
          if [ "${{ needs.build-rag.result }}" == "success" ]; then
            echo "  - safvr/wanwu-rag:latest"
          fi
          if [ "${{ needs.build-agent.result }}" == "success" ]; then
            echo "  - safvr/agent:latest"
          fi
          echo ""
          echo "Skipped jobs (no changes detected):"
          if [ "${{ needs.build-backend.result }}" != "success" ]; then
            echo "  - build-backend (skipped)"
          fi
          if [ "${{ needs.build-frontend.result }}" != "success" ]; then
            echo "  - build-frontend (skipped)"
          fi
          if [ "${{ needs.build-rag.result }}" != "success" ]; then
            echo "  - build-rag (skipped)"
          fi
          if [ "${{ needs.build-agent.result }}" != "success" ]; then
            echo "  - build-agent (skipped)"
          fi

      - name: Trigger Dokploy Compose Deployment
        run: |
          echo "🚀 Triggering Dokploy compose deployment..."
          
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            "${{ secrets.DOKPLOY_URL }}" \
            -H "x-api-key: ${{ secrets.DOKPLOY_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"composeId": "${{ secrets.DOKPLOY_COMPOSE_ID }}"}')
          
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')
          
          echo "Response: $BODY"
          echo "HTTP Status: $HTTP_CODE"
          
          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "✅ Dokploy deployment triggered successfully!"
          else
            echo "⚠️ Dokploy API returned status $HTTP_CODE"
            echo "Response body: $BODY"
            exit 1
          fi
