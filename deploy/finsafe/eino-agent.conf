[program:eino-agent]
command=/opt/finsafe/finsafe --policy /etc/finsafe/eino-agent.yaml self-confine -- /usr/local/bin/eino-agent serve
environment=PORT="4097",HOME="/home/root",XDG_CONFIG_HOME="/home/root/.config",XDG_CACHE_HOME="/home/root/.cache",XDG_DATA_HOME="/home/root/.local/share",XDG_STATE_HOME="/home/root/.local/state"
directory=/home/root/workspace
autorestart=true
startsecs=5
startretries=3
stopasgroup=true
killasgroup=true
priority=801
user=root
stdout_logfile=%(ENV_LOG_DIR)s/eino-agent.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
redirect_stderr=true
