[unix_http_server]
file=/tmp/wanwu-supervisor.sock
chmod=0700

[supervisord]
user=root
logfile=/var/log/gem/supervisord.log
pidfile=/tmp/wanwu-supervisor.pid

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/wanwu-supervisor.sock

[include]
files=/opt/gem/supervisord/opencode.conf
