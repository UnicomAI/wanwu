[program:opencode]
command=/root/.opencode/bin/opencode serve --port 4096 --hostname 0.0.0.0 --print-logs
environment=HOME="/home/root",XDG_CONFIG_HOME="/home/root/.config",XDG_CACHE_HOME="/home/root/.cache",XDG_DATA_HOME="/home/root/.local/share",XDG_STATE_HOME="/home/root/.local/state"
directory=/home/root/workspace
autorestart=true
startsecs=5
startretries=3
stopasgroup=true
killasgroup=true
priority=800
user=root
stdout_logfile=%(ENV_LOG_DIR)s/opencode.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
redirect_stderr=true
