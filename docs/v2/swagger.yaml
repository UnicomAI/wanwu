  /statistic/api/chart:
    post:
      consumes:
      - application/json
      description: API Key调用趋势 + API Key调用次数排行
      parameters:
      - description: 请求参数
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/request.APIKeyStatisticV2ChartReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/response.APIKeyStatisticV2Chart'
              type: object
      security:
      - JWT: []
      summary: 获取API Key统计趋势+排行
      tags:
      - app_observability.statistic
  /statistic/api/list:
    post:
      consumes:
      - application/json
      description: 按API Key+路径聚合的调用统计（分页）。sortField 可选数值指标：callCount、callFailure、streamCount、nonStreamCount、streamFailure、nonStreamFailure、failureRate、avgFirstTokenLatency、avgCosts、firstTokenLatency、costs
      parameters:
      - description: 请求参数
        in: body
        name: data
