                  - properties:
                      list:
                        items:
                          $ref: '#/definitions/response.APIKeyStatisticV2ListItem'
                        type: array
                    type: object
              type: object
      security:
      - JWT: []
      summary: 获取API Key调用统计列表
      tags:
      - app_observability.statistic
