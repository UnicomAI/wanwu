server {
    #########################
    ## Basic service configuration
    #########################
    listen               8081;             # Listen on port 8081 (HTTP)
    server_name          127.0.0.1;        # 服务域名（本机） [EN] Service domain name (local)
    client_max_body_size 2048M;            # 允许上传最大2GB文件 [EN] Allows uploading files up to 2GB
    keepalive_timeout    128s;             # 保持连接超时时间 [EN] Keep connected timeout
    server_tokens off;

    # 代理通用超时 [EN] Agent generic timeout
    # proxy_connect_timeout 60s;           # Nginx与上游服务器建立连接的超时时间 [EN] proxy_connect_timeout 60s; # Timeout for Nginx to establish a connection with the upstream server
    # proxy_send_timeout 60s;              # Nginx向上游服务器发送请求的超时时间 [EN] proxy_send_timeout 60s; # The timeout period for Nginx to send requests to the upstream server
    proxy_read_timeout 600s;               # Nginx从上游服务器读取响应的超时时间 [EN] Nginx timeout for reading response from upstream server

    #########################
    ## Gzip压缩配置 [EN] # Gzip compression configuration
    #########################
    gzip                on;                # 启用Gzip压缩 [EN] Enable Gzip compression
    gzip_static         on;                # 优先使用预压缩.gz文件 [EN] Prefer precompressed .gz files
    gzip_min_length     1k;                # 最小压缩文件大小 [EN] Minimum compressed file size
    gzip_buffers        4 16k;             # 压缩缓冲区大小 [EN] Compression buffer size
    gzip_http_version   1.1;               # 压缩协议版本 [EN] Compression protocol version
    gzip_comp_level     2;                 # 压缩级别（1-9） [EN] Compression level (1-9)
    gzip_types          text/plain application/javascript application/x-javascript text/javascript text/css application/xml application/xml+rss;
    gzip_vary           on;                # 添加Vary响应头 [EN] Add Vary response header
    gzip_proxied        expired no-cache no-store private auth;
    gzip_disable        "MSIE [1-6]\.";    # 禁用旧版IE压缩 [EN] Disable legacy IE compression

    #########################
    ## 前端aibase静态资源路由 [EN] # Front-end aibase static resource routing
    #########################
    location ^~ / {
        proxy_buffer_size          1024k;  # 代理缓冲区设置 [EN] Proxy buffer settings
        proxy_buffers              16 1024k;
        proxy_busy_buffers_size    2048k;
        proxy_temp_file_write_size 2048k;
        root   /usr/share/nginx/html/aibase;  # 静态文件根目录 [EN] Static file root directory
        index  index.html index.htm;          # 默认索引文件 [EN] Default index file
    }

    location ^~ /aibase {
        try_files $uri $uri/ /aibase/index.html;  # 前端路由fallback [EN] Front-end routing fallback
        root   /usr/share/nginx/html;
        index  index.html index.htm;
    }

    location ^~ /sub {
        try_files $uri $uri/ /sub/index.html;
        root   /usr/share/nginx/html/aibase/;
        index  index.html index.htm;
    }

    location ^~ /img {
        root   /usr/share/nginx/html/aibase/;  # 图片资源目录 [EN] Picture resource directory
    }

    #########################
    ## 前端Workflow静态资源路由 [EN] # Front-end Workflow static resource routing
    ## Workflow frontend is served from workflow container on port 8999
    #########################
    location ^~ /workflow/ {
        proxy_pass       http://workflow-wanwu:8999/workflow/;
        proxy_buffering  off;
        proxy_cache      off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    #########################
    ## 后端API代理配置 [EN] # Backend API proxy configuration
    #########################
    location ^~ /user/api/ {
        proxy_pass       http://bff-service:6668/;  # 用户服务API [EN] User service API
        proxy_buffering  off;                       # 关闭缓冲（适合实时API） [EN] Turn off buffering (suitable for real-time APIs)
        proxy_cache      off;                       # 禁用缓存 [EN] Disable caching
    }

    location ^~ /use/model/api/ {
        proxy_pass       http://bff-service:6668/;  # 模型服务API [EN] Model service API
        proxy_buffering  off;
        proxy_cache      off;
    }

    location ^~ /service/api/ {
        proxy_pass       http://bff-service:6668/;  # 通用服务API [EN] Common service API
        proxy_buffering  off;
        proxy_cache      off;
    }

    location ^~ /service/url/ {
        proxy_pass       http://bff-service:6668/;  # WebUrlAPI
        proxy_buffering  off;
        proxy_cache      off;
    }

    location ^~ /minio/download/api/ {
        proxy_pass      http://minio-wanwu:9000/;  # minio public
        proxy_buffering off;
        proxy_cache     off;
    }

    #########################
    ## Workflow API代理配置 [EN] # Workflow API proxy configuration
    #########################
    location ^~ /api/ {
        proxy_pass       http://workflow-wanwu:8999/api/;
        proxy_buffering  off;
        proxy_cache      off;
    }

    location ^~ /v1/ {
        proxy_pass       http://workflow-wanwu:8999/v1/;
        proxy_buffering  off;
        proxy_cache      off;
    }

    location ^~ /workflow/minio/presign/ {
        proxy_pass      http://workflow-wanwu:8998/;
        proxy_buffering off;
        proxy_cache     off;
    }

    # agentscope代理（老版工作流） [EN] agentscope agent (old version workflow)
    # location ^~ /workflow/api/ {
    #     proxy_pass      http://agentscope-wanwu:6672/;
    #     proxy_buffering off;
    #     proxy_cache     off;
    # }

    #########################
    ## 其他优化建议（可选） [EN] # Other optimization suggestions (optional)
    #########################
    # access_log /var/log/nginx/access.log main;  # 自定义访问日志 [EN] access_log /var/log/nginx/access.log main; # Customize access log
    # error_log  /var/log/nginx/error.log warn;   # 错误日志级别 [EN] error_log /var/log/nginx/error.log warn; # Error log level
}