workflows:
  # Incident Investigation Workflows
  - templateId: "incident_report_generator"
    category: "incident_investigation"
    avatar: ""
    name: "Incident Report from Image"
    schemaPath: "incident_report_generator/incident_report_generator.json"
    desc: "Generate incident reports from uploaded images"
    author: "EHS Team"
    summary: "Upload an incident scene image and automatically generate a comprehensive incident report with hazard identification, risk assessment, root cause analysis, and corrective action recommendations."
    feature: |
      - Start: Upload incident scene image
      - Analyze Image: AI analyzes the image for safety hazards
      - Generate Report: Creates structured incident report with:
        * Incident description
        * Hazards identified
        * Immediate risks
        * Root cause analysis
        * Corrective actions
        * Severity rating
      - End: Returns formatted incident report
    scenario: "Incident reporting, Safety investigations, Hazard documentation"
    note: "Import template and configure: LLM node model"

  # Compliance Workflows
  - templateId: "osha_regulation_search"
    category: "compliance"
    avatar: ""
    name: "OSHA Regulation Search"
    schemaPath: "osha_regulation_search/osha_regulation_search.json"
    desc: "Search and summarize OSHA regulations"
    author: "EHS Team"
    summary: "Search for OSHA regulations using web search (Perplexity MCP) and get AI-summarized compliance requirements with citations and applicability guidance."
    feature: |
      - Start: Enter regulation search query
      - Web Search: Search OSHA regulations using MCP tool
      - Summarize: AI summarizes regulations with:
        * Regulation overview
        * Applicability
        * Compliance requirements
        * CFR citations
        * Enforcement details
      - End: Returns compliance summary
    scenario: "Regulatory compliance, OSHA research, Compliance verification"
    note: "Import template and configure: LLM node model, MCP web search service (Perplexity)"

  - templateId: "safety_policy_generator"
    category: "compliance"
    avatar: ""
    name: "Safety Policy Generator"
    schemaPath: "safety_policy_generator/safety_policy_generator.json"
    desc: "Generate safety policies based on best practices"
    author: "EHS Team"
    summary: "Research industry best practices using web search and generate comprehensive safety policy documents tailored to your industry and requirements."
    feature: |
      - Start: Enter policy topic and industry
      - Research: Web search for safety best practices
      - Generate Policy: Creates complete policy with:
        * Policy statement and scope
        * Responsibilities
        * Procedures
        * Training requirements
        * Compliance monitoring
        * Enforcement
        * Review schedule
      - End: Returns formatted policy document
    scenario: "Policy development, Safety program management, Compliance documentation"
    note: "Import template and configure: LLM node model, MCP web search service"

  # Corrective Actions Workflows
  - templateId: "corrective_action_tracker"
    category: "corrective_actions"
    avatar: ""
    name: "Corrective Action Plan Generator"
    schemaPath: "corrective_action_tracker/corrective_action_tracker.json"
    desc: "Generate corrective action plans for safety findings"
    author: "EHS Team"
    summary: "Input a safety issue or finding and automatically generate a structured corrective action plan with root cause analysis, immediate and long-term actions, timelines, and verification methods."
    feature: |
      - Start: Enter safety issue, severity, and responsible party
      - Generate Action Plan: Creates comprehensive plan with:
        * Issue summary
        * Root cause analysis
        * Immediate actions
        * Long-term corrective actions
        * SMART timelines
        * Responsible parties
        * Verification methods
        * Follow-up actions
      - End: Returns corrective action plan
    scenario: "Corrective action management, Safety finding resolution, Continuous improvement"
    note: "Import template and configure: LLM node model"

  # Training Workflows
  - templateId: "training_record_formatter"
    category: "training"
    avatar: ""
    name: "Training Record Formatter"
    schemaPath: "training_record_formatter/training_record_formatter.json"
    desc: "Format and organize training records for audits"
    author: "EHS Team"
    summary: "Transform raw training data into organized, audit-ready records with compliance status, certification tracking, and identification of training gaps."
    feature: |
      - Start: Input raw training data and format type
      - Format Records: Organizes training data with:
        * Employee information
        * Training details
        * Certification status
        * Compliance status
        * Attendance records
        * Competency assessments
        * Summary statistics
      - End: Returns formatted training records
    scenario: "Training management, Audit preparation, Compliance tracking"
    note: "Import template and configure: LLM node model"

  # Audit Workflows
  - templateId: "audit_evidence_compiler"
    category: "audit"
    avatar: ""
    name: "Audit Evidence Compiler"
    schemaPath: "audit_evidence_compiler/audit_evidence_compiler.json"
    desc: "Compile and organize audit evidence packets"
    author: "EHS Team"
    summary: "Upload audit documents and automatically compile them into an organized evidence packet with proper indexing, cross-referencing, and gap identification."
    feature: |
      - Start: Upload audit documents
      - Parse Documents: Extracts text from documents
      - Compile Evidence: Organizes into structured packet with:
        * Evidence index
        * Objective evidence
        * Supporting documentation
        * Interview notes
        * Photos and visual evidence
        * Compliance matrix
        * Gaps identified
        * Recommendations
      - End: Returns organized evidence packet
    scenario: "Audit preparation, Compliance verification, Evidence management"
    note: "Import template and configure: LLM node model"

  # Reporting Workflows
  - templateId: "leadership_safety_report"
    category: "reporting"
    avatar: ""
    name: "Leadership Safety Report"
    schemaPath: "leadership_safety_report/leadership_safety_report.json"
    desc: "Generate executive-level safety performance reports"
    author: "EHS Team"
    summary: "Input safety metrics and data to automatically generate concise, executive-level safety performance reports with trends, analysis, and strategic recommendations."
    feature: |
      - Start: Input safety data and reporting period
      - Generate Report: Creates executive summary with:
        * Executive highlights
        * Safety performance metrics
        * Trends and analysis
        * Major incidents summary
        * Corrective actions status
        * Compliance status
        * Risk areas
        * Strategic recommendations
      - End: Returns leadership report (1-2 pages)
    scenario: "Executive reporting, Safety performance tracking, Leadership communication"
    note: "Import template and configure: LLM node model"
