server:
  grpc_endpoint: 0.0.0.0:9797
  max_recv_msg_size: 4294967296 # 1024 * 1024 * 1024 * 4 = 4G

log:
  std: true
  level: debug
  logs:
    - enable: true
      filename: log/operate-info.log
      level: info
      max_size: 10
      max_backups: 10
      max_age: 30
    - enable: true
      filename: log/operate-err.log
      level: error
      max_size: 10
      max_backups: 10
      max_age: 30

db:
  name: mysql # mysql | postgres | tidb | oceanbase
  mysql:
    address: localhost:3306
    user: root
    password: Wanwu123456
    database: operate_service
    max_open_conns: 16
    max_idle_conns: 16
    log_mode: true
  postgres:
    address: localhost:5432
    user: postgres
    password: Wanwu123456
    database: operate_service
    max_open_conns: 16
    max_idle_conns: 16
    log_mode: true
  tidb:
    address: localhost:4000
    user: root
    password: Wanwu123456
    database: operate_service
    max_open_conns: 16
    max_idle_conns: 16
    log_mode: true
  oceanbase:
    address: localhost:2881
    user: root
    password: Wanwu123456
    database: operate_service
    max_open_conns: 16
    max_idle_conns: 16
    log_mode: true

# --- microservice ---
# 消息中心的受众计算与读侧可见性以 iam 的 org_users + 启用状态为数据源
iam:
  host: iam-service:8888

# --- 消息中心 ---
notice:
  max_audience_size: 500  # 特定用户名单 S 上限；超限拒绝生成该事件消息（打点告警），不阻塞业务